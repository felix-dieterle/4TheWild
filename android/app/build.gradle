plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

/* versionCode must increase with every delivered APK. Values below 1000 are
 * shifted into the 1000+ range so old builds (versionCode 1..n) can always be
 * upgraded in place. Override with -PversionCode=<n> (CI does this). */
def resolvedVersionCode = project.findProperty('versionCode') != null
        ? project.property('versionCode').toString().toInteger()
        : 1000
if (resolvedVersionCode < 1000) {
    resolvedVersionCode += 1000
}

android {
    namespace 'de.felixdieterle.forwild'
    compileSdk 34

    defaultConfig {
        applicationId "de.felixdieterle.forwild"
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
}
